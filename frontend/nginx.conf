# Fantom platform frontend: SPA + API proxy
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Worker PWA entry (separate HTML; installable via Add to Home Screen)
    location = /worker.html {
        try_files $uri /worker.html;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri /sw.js;
    }
    location = /worker-manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri /worker-manifest.json;
    }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /platform.html is emitted by the multi-page vite build (see
    # vite.config.ts rollupOptions.input) and is served by the generic
    # `location /` try_files below. A dedicated fallback here would create an
    # internal redirect cycle (500) whenever the file is missing.

    # AI-Studio defect analysis lives in the dev server (frontend/server.ts),
    # not in this image. Return a clear JSON signal instead of an HTML 404 so
    # the studio UI shows an honest message (no fake analysis in Docker).
    location = /api/analyze-defect {
        default_type application/json;
        return 501 '{"success":false,"error":"Defect analysis requires the dev server (npm run dev, frontend/server.ts). Not available in the Docker image."}';
    }

    # API proxy to the FastAPI backend service (compose network)
    location /api/ {
        client_max_body_size 64m;   # evaluation CSV uploads (service cap: 50 MB)
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;    # large-CSV evaluation can take a while
        proxy_send_timeout 60s;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
