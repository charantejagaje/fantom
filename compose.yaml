services:
  # FastAPI backend + ML inference
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Frontend dashboard (Streamlit or React dev server)
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: fully offline LLM (comment out if using Groq/Gemini only)
