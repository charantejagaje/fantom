[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL is injected from app settings in alembic/env.py
# (DB_ENGINE / DB_* environment variables).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
console = class:StreamHandler,args:(sys.stderr,),level:NOTSET,formatter:simple

[formatters]
simple = format:%(levelname)-5.5s %(message)s

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simple

[formatter_simple]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
